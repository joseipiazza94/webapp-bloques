<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Taller Maker • Bloques por Componentes</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <header>
      <h1>Taller de Robótica • Algoritmos por Componentes</h1>

      <!-- CONTROLES GLOBALES DE SALIDA -->
      <div
        style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"
      >
        <!-- Selector Puerto COM -->
        <div
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
          "
        >
          <label
            for="sel-puerto-com"
            style="font-weight: 600; font-size: 13px; color: #fff"
            >Puerto:</label
          >
          <select
            id="sel-puerto-com"
            style="
              padding: 3px 6px;
              border-radius: 4px;
              font-weight: bold;
              border: 1px solid #ccc;
              cursor: pointer;
            "
          >
            <option value="COM1">COM1</option>
            <option value="COM2">COM2</option>
            <option value="COM3">COM3</option>
            <option value="COM4">COM4</option>
            <option value="COM5">COM5</option>
            <option value="COM6">COM6</option>
            <option value="COM7" selected>COM7</option>
            <option value="COM8">COM8</option>
            <option value="COM9">COM9</option>
            <option value="COM10">COM10</option>
          </select>
        </div>

        <!-- Selector Modelo HuskyLens 2 -->
        <div
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
          "
        >
          <label
            for="sel-modelo-husky"
            style="font-weight: 600; font-size: 13px; color: #fff"
            >Modo Husky:</label
          >
          <select
            id="sel-modelo-husky"
            style="
              padding: 3px 6px;
              border-radius: 4px;
              font-weight: bold;
              border: 1px solid #ccc;
              cursor: pointer;
            "
          >
            <option value="ALGORITHM_SELF_LEARNING_CLASSIFICATION" selected>
              Clasificador de Objetos
            </option>
            <option value="ALGORITHM_HAND_RECOGNITION">
              Reconocimiento de Gestos / Manos
            </option>
            <option value="ALGORITHM_FACE_RECOGNITION">
              Reconocimiento Facial
            </option>
            <option value="ALGORITHM_OBJECT_TRACKING">
              Seguimiento de Objetos
            </option>
          </select>
        </div>

        <button class="btn-copy" onclick="exportarLogica()">
          📋 Copiar Resumen para el Asistente
        </button>
      </div>
    </header>

    <!-- PANEL SUPERIOR: REGISTRO DINÁMICO DE HARDWARE -->
    <div class="hw-manager">
      <div class="hw-manager-title">🔌 Componentes Conectados en la Mesa:</div>
      <div class="hw-controls">
        <select id="sel-tipo-comp">
          <option value="led">LED Simple (Digital)</option>
          <option value="servo">Servomotor (Digital)</option>
          <option value="boton">Pulsador / Botón (1 Pin)</option>
          <option value="switch">Switch 2 Estados (1 Pin)</option>
          <option value="selector3">Selector 3 Posiciones (2 Pines)</option>
          <option value="dht">DHT11 Temp/Hum (Digital)</option>
          <option value="pot">Potenciómetro (Analógico)</option>
          <option value="ldr">Sensor Luz LDR (Analógico)</option>
          <option value="ultra">Sensor Ultrasónico HC-SR04 (Trig, Echo)</option>
        </select>
        <input
          type="text"
          id="inp-pin-comp"
          placeholder="Pin (ej: 13, A0)"
          value="13"
          style="width: 100px"
        />
        <button class="btn-add-hw" onclick="agregarComponenteHardware()">
          + Conectar Componente
        </button>
        <span class="hw-note">HuskyLens va fija a I2C (A4 SDA / A5 SCL).</span>
      </div>
      <div class="hw-chips-list" id="hw-chips-list"></div>
    </div>

    <div class="workspace">
      <!-- PANEL ARDUINO -->
      <div class="column">
        <div class="col-header col-arduino">
          <span>🤖 ARDUINO (Hardware y Sensores)</span>
          <button class="btn-del" onclick="limpiar('board-arduino')">
            Borrar Todo
          </button>
        </div>
        <div class="toolbox" id="toolbox-arduino"></div>
        <div class="board" id="board-arduino"></div>
      </div>

      <!-- PANEL NOTEBOOK -->
      <div class="column">
        <div class="col-header col-pc">
          <span>💻 NOTEBOOK (Holograma y Multimedia)</span>
          <button class="btn-del" onclick="limpiar('board-pc')">
            Borrar Todo
          </button>
        </div>
        <div class="toolbox" id="toolbox-pc"></div>
        <div class="board" id="board-pc"></div>
      </div>
    </div>

    <script src="catalogo.js"></script>
    <script src="app.js"></script>
  </body>
</html>
